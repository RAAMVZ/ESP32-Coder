# Attests the SHA-256 identity of locally built, published release EXE and ZIP.
# This is a release-artifact attestation, NOT proof that GitHub built the binary.
name: ESP32 Coder release artifact attestation
run-name: ESP32 Coder attestation ${{ inputs.release_tag }}
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag, e.g. v1.1.11'
        required: true
        type: string
permissions:
  contents: read
jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
      - name: Download exact release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid stable release tag'; exit 1; }
          mkdir -p release
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --dir release \
            --pattern 'esp32coder.exe' \
            --pattern "ESP32-Coder-${version}.zip" \
            --pattern "VirusTotal-Report-${RELEASE_TAG}.json"
      - name: Verify release manifest and file SHA-256 before attesting
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, sys, zipfile, traceback

          # Validate the prebuilt release bytes; NEVER claim these were compiled in Actions.
          # Print actionable diagnostics to the job log instead of an opaque AssertionError.
          try:
              tag = os.environ['RELEASE_TAG']
              version = tag.removeprefix('v')
              repo = os.environ['GITHUB_REPOSITORY']
              root = pathlib.Path('release')
              exe = root / 'esp32coder.exe'
              archive = root / f'ESP32-Coder-{version}.zip'
              manifest_path = root / f'VirusTotal-Report-{tag}.json'

              def require(test, message):
                  if not test:
                      raise ValueError(message)

              def sha256(path_or_file):
                  digest = hashlib.sha256()
                  for chunk in iter(lambda: path_or_file.read(1024 * 1024), b''):
                      digest.update(chunk)
                  return digest.hexdigest()

              print('Release tag:', tag, 'repository:', repo, flush=True)
              print('Downloaded files:', ', '.join(sorted(p.name for p in root.iterdir())), flush=True)
              for path in (exe, archive, manifest_path):
                  require(path.is_file(), f'Missing release asset: {path.name}')

              # utf-8-sig also accepts normal UTF-8 without a BOM.
              report = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
              require(isinstance(report, dict), 'VirusTotal manifest is not a JSON object')
              def field(key, expected):
                  actual = report.get(key)
                  require(type(actual) is type(expected) and actual == expected,
                          f'Manifest {key} mismatch: expected {expected!r}, got {actual!r}')

              field('schema_version', 1)
              field('version', version)
              field('release_tag', tag)
              field('filename', 'esp32coder.exe')
              field('zip_filename', archive.name)
              field('github_release', f'https://github.com/{repo}/releases/tag/{tag}')
              field('updater_ed25519_verified', True)
              vt = report.get('virustotal')
              require(isinstance(vt, dict), 'VirusTotal section missing in JSON report')
              for key in ('malicious', 'suspicious'):
                  require(type(vt.get(key)) is int and vt[key] == 0,
                          f'VirusTotal {key} is not zero: {vt.get(key)!r}')
              print('Manifest metadata and VirusTotal zero detections: OK', flush=True)

              with exe.open('rb') as f:
                  actual_exe_hash = sha256(f)
              expected_exe_hash = str(report.get('sha256', '')).lower()
              require(actual_exe_hash == expected_exe_hash,
                      f'EXE SHA-256 mismatch: expected {expected_exe_hash}, downloaded {actual_exe_hash}')
              print('EXE SHA-256 verified:', actual_exe_hash, flush=True)

              with archive.open('rb') as f:
                  actual_zip_hash = sha256(f)
              expected_zip_hash = str(report.get('zip_sha256', '')).lower()
              require(actual_zip_hash == expected_zip_hash,
                      f'ZIP SHA-256 mismatch: expected {expected_zip_hash}, downloaded {actual_zip_hash}')
              print('ZIP SHA-256 verified:', actual_zip_hash, flush=True)

              with zipfile.ZipFile(archive) as z:
                  # ZIPs produced on Windows may contain either path separator.
                  members = [member for member in z.infolist() if not member.is_dir()]
                  entries = [member for member in members
                             if member.filename.replace('\\', '/') == 'ESP32 Coder/esp32coder.exe']
                  require(len(entries) == 1 and len(members) == 1,
                          'Unexpected ZIP payload (expected only ESP32 Coder/esp32coder.exe); got: '
                          + ', '.join(member.filename for member in members[:12]))
                  with z.open(entries[0]) as embedded:
                      actual_embedded_hash = sha256(embedded)
                  require(actual_embedded_hash == actual_exe_hash,
                          f'ZIP embedded EXE SHA-256 mismatch: {actual_embedded_hash} vs {actual_exe_hash}')
              print('EXE inside ZIP matches separately published EXE: OK', flush=True)

              # Attest only the executable and its ZIP; JSON is a verification input.
              manifest_path.unlink()
              print('Verification PASS. GitHub did not compile this EXE.', flush=True)
          except Exception as error:
              print(f'::error title=Release manifest or SHA-256 validation failed::{error}', flush=True)
              traceback.print_exc()
              sys.exit(1)
          PYTHON
      - name: Create Sigstore artifact attestation for EXE and ZIP
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: release/*
      - name: Verify both subjects using the GitHub attestation API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for subject in release/esp32coder.exe release/ESP32-Coder-*.zip; do
            success=0
            for try in 1 2 3 4 5; do
              if gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/esp32-coder-release-attestation.yml"; then
                success=1; break
              fi
              sleep 8
            done
            if [[ "$success" != 1 ]]; then echo "Attestation verification failed for $subject"; exit 1; fi
          done
      - name: Upload downloadable Sigstore bundle to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          filename="ESP32-Coder-${RELEASE_TAG}.sigstore.json"
          cp "$BUNDLE_PATH" "$filename"
          # Do not overwrite previously published proof. Another run with the same
          # tag must not silently modify already downloaded release artifacts.
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$filename"; then
            echo "Bundle already exists: $filename; leaving the original unchanged."
          else
            gh release upload "$RELEASE_TAG" "$filename" -R "$GITHUB_REPOSITORY"
          fi
      - name: Print verification links
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "GitHub attestation: $ATTESTATION_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow verifies and attests release files; it does not rebuild the EXE from source.' >> "$GITHUB_STEP_SUMMARY"
