<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>ESP32 Coder — Результаты аттестации GitHub Sigstore</title><link rel="icon" href="assets/favicon.png" type="image/png"><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#10191c;background:#f7f9f9;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:35px 18px}main{max-width:860px;margin:auto;border-radius:16px;border:1px solid #d3e0db;background:#fff;padding:clamp(20px,4vw,40px);box-shadow:0 5px 28px #0b28200a}h1{font-size:clamp(1.5rem,3.5vw,2rem);margin:.4rem 0 1rem}a{color:#086d63;overflow-wrap:anywhere}.back{display:inline-block;margin:2px 0 22px}p{line-height:1.6}.notice{border-left:3px solid #15847a;padding-left:13px;margin:18px 0 26px}.stat{padding:14px 0;border-top:1px solid #d7e4df;overflow-wrap:anywhere}.stat dt{font-weight:700;margin-bottom:5px}.stat dd{margin:0;line-height:1.5}.hash{font-family:Consolas,monospace;font-size:.88rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f8f7;border-radius:8px;padding:15px}
</style></head><body><main><a class="back" href="ru.html">Вернуться</a><h1>ESP32 Coder — Результаты аттестации GitHub Sigstore</h1><p class="notice">Аттестация подтверждает происхождение опубликованных EXE/ZIP и их SHA-256. Она не доказывает отсутствие вредоносного кода и не означает, что бинарники собраны на GitHub.</p><div id="report" role="status" aria-live="polite">Проверка статуса аттестации…</div></main><script src="site-config.js"></script><script>
(async()=>{'use strict';const panel=document.getElementById('report');const sha=/^[a-f0-9]{64}$/i;const root='https://github.com/RAAMVZ/ESP32-Coder';
function row(name,val,hashed=false){const r=document.createElement('dl');r.className='stat';const k=document.createElement('dt');k.textContent=name;const v=document.createElement('dd');v.textContent=String(val);if(hashed)v.className='hash';r.append(k,v);panel.append(r)}
function link(label,url){if(!/^https:\/\//.test(url))return;const a=document.createElement('a');a.textContent=label;a.href=url;a.rel='noopener noreferrer';a.target='_blank';const p=document.createElement('p');p.append(a);panel.append(p)}
// A verified manifest from an older release is NOT proof for the latest release.
const current=window.ESP32_SITE_CONFIG && window.ESP32_SITE_CONFIG.publishedVersion;
const expectedTag=/^v\d+\.\d+\.\d+$/.test(current||'')?current:null;
const noCurrent='Для текущего релиза пока нет опубликованной подтверждённой аттестации Sigstore.';
try{const responses=await Promise.all([fetch('security/latest.json',{cache:'no-store'}),fetch('security/attestation.json',{cache:'no-store'}),fetch('security/ai-latest.json',{cache:'no-store'})]);if(!responses[0].ok||!responses[1].ok)throw Error(noCurrent);const [release,a]=await Promise.all(responses.slice(0,2).map(x=>x.json()));
const audit=responses[2].ok?await responses[2].json():null;
if(!expectedTag||release.release_tag!==expectedTag||a.release_tag!==expectedTag)throw Error(noCurrent+' '+(expectedTag||''));
if(audit&&audit.schema_version===2&&audit.provider==='OpenAI Codex CLI'&&audit.status==='completed'&&
   (audit.release_tag!==expectedTag||audit.exe_sha256!==release.sha256||audit.zip_sha256!==release.zip_sha256))throw Error(noCurrent+' '+expectedTag);
if(!a||!release||a.schema_version!==1||a.verified!==true||release.release_tag!==a.release_tag||!/^v\d+\.\d+\.\d+$/.test(a.release_tag||'')||a.filename!=='esp32coder.exe'||release.filename!==a.filename||!sha.test(a.sha256)||!sha.test(a.zip_sha256)||a.sha256!==release.sha256||a.zip_sha256!==release.zip_sha256||a.github_release!==root+'/releases/tag/'+a.release_tag||a.github_release!==release.github_release||a.workflow!=='RAAMVZ/ESP32-Coder/.github/workflows/esp32-coder-release-attestation.yml'||a.bundle_url!==root+'/releases/download/'+a.release_tag+'/ESP32-Coder-'+a.release_tag+'.sigstore.json'||!/^https:\/\/github\.com\/RAAMVZ\/ESP32-Coder\/actions\/runs\/\d+$/.test(a.workflow_run_url))throw Error('Данные аттестации не соответствуют файлам релиза');
if(release.audit_session_utc&&a.audit_session_utc!==release.audit_session_utc)throw Error('Идентификаторы сеанса аудита не совпадают');
panel.textContent='';row('Статус','Подтверждено системой публикации');row('Релиз',a.release_tag);if(a.audit_session_utc)row('Время аудита (UTC)',a.audit_session_utc);if(a.verification_completed_utc)row('Время проверки Sigstore (UTC)',a.verification_completed_utc);row('EXE SHA-256',a.sha256,true);row('ZIP SHA-256',a.zip_sha256,true);link('Запуск GitHub Actions',a.workflow_run_url);link('Доказательство Sigstore (bundle)',a.bundle_url);link('Релиз GitHub',a.github_release);const title=document.createElement('h2');title.textContent='Команда для независимой проверки';panel.append(title);const code=document.createElement('pre');code.textContent='gh attestation verify esp32coder.exe --repo RAAMVZ/ESP32-Coder --signer-workflow RAAMVZ/ESP32-Coder/.github/workflows/esp32-coder-release-attestation.yml';panel.append(code);
}catch(e){panel.textContent='Проверка недоступна: '+(e?.message||'Неизвестная ошибка')}
})();</script></body></html>
